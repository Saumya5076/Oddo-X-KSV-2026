<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vendor Management</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="dashboard-container">

    <aside class="sidebar">

        <a href="index.html" class="sidebar-logo">
            VendorBridge
        </a>

        <ul>
            <li><a href="index.html">🏠 Home</a></li>

            <li><a href="dashboard.html">Dashboard</a></li>

            <li class="active">
                <a href="vendors.html">Vendors</a>
            </li>

            <li><a href="rfq.html">RFQs</a></li>

            <li><a href="quotations.html">Quotations</a></li>

            <li><a href="approvals.html">Approvals</a></li>

            <li><a href="purchase-orders.html">Purchase Orders</a></li>

            <li><a href="invoices.html">Invoices</a></li>

            <li><a href="reports.html">Reports</a></li>

        </ul>

    </aside>

    <main class="dashboard-main">

        <div class="topbar">

            <div>

                <h1>Vendor Management</h1>

                <p class="welcome-text">
                    Manage all vendors here
                </p>

            </div>

        </div>

        <div class="form-card">

            <h2>Add New Vendor</h2>

            <form id="vendorForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label>Vendor Name</label>

                        <input
                        type="text"
                        name="vendor_name"
                        required>

                    </div>

                    <div class="form-group">

                        <label>Email</label>

                        <input
                        type="email"
                        name="email"
                        required>

                    </div>

                    <div class="form-group">

                        <label>Phone</label>

                        <input
                        type="text"
                        name="phone"
                        required>

                    </div>

                    <div class="form-group">

                        <label>Category</label>

                        <input
                        type="text"
                        name="category"
                        required>

                    </div>

                </div>

                <button
                type="submit"
                class="add-btn">

                    Save Vendor

                </button>

            </form>

        </div>

        <div class="table-card">

            <h2>Vendor List</h2>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Vendor</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Category</th>

                    </tr>

                </thead>

                <tbody id="vendorTable">

                </tbody>

            </table>

        </div>

    </main>

</div>

<script>

function loadVendors(){

fetch("php/get_vendors.php")

.then(response=>response.json())

.then(data=>{

let html="";

data.forEach(vendor=>{

html += `

<tr>

<td>${vendor.id}</td>

<td>${vendor.vendor_name}</td>

<td>${vendor.email}</td>

<td>${vendor.phone}</td>

<td>${vendor.category}</td>

</tr>

`;

});

document.getElementById("vendorTable").innerHTML = html;

});

}

loadVendors();

document
.getElementById("vendorForm")
.addEventListener(
"submit",
function(e){

e.preventDefault();

const formData =
new FormData(this);

fetch(
"php/add_vendor.php",
{
method:"POST",
body:formData
}
)

.then(response=>response.text())

.then(data=>{

alert(data);

this.reset();

loadVendors();

});

});

</script>

</body>

</html>
